# Builds an UNSIGNED iPhone app (.ipa) on GitHub's free macOS runner.
# SideStore / Sideloadly / TrollStore then sign it with your own Apple ID on install.
# Run it: push a tag like v1.0.0, or Actions tab > "Build iOS app" > Run workflow.
name: Build iOS app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript packages
        run: npm ci

      - name: Unit tests (GPS maths, GPX, CSV)
        run: node --experimental-strip-types --test src/lib/geo.test.ts

      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build (unsigned)
        working-directory: ios
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WS%.xcworkspace}"
          echo "Workspace: $WS  Scheme: $SCHEME"
          set -o pipefail
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/IronMan.xcarchive" archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | tail -60

      - name: Package .ipa
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p Payload
          cp -R IronMan.xcarchive/Products/Applications/*.app Payload/
          zip -qry IronMan.ipa Payload
          ls -la IronMan.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: IronMan-ipa
          path: ${{ runner.temp }}/IronMan.ipa

      - name: Attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/IronMan.ipa
